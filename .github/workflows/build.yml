name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & components
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Cache payloads
        uses: actions/cache@v4
        with:
          path: |
            /tmp/st-mobile-node
            /tmp/st-mobile-st
          key: payload-${{ hashFiles('ci/fetch_node_runtime.sh', 'ci/build_st_bundle.sh') }}

      - name: Fetch pinned Node runtime
        run: bash ci/fetch_node_runtime.sh

      - name: Build SillyTavern bundle
        run: bash ci/build_st_bundle.sh

      - name: Prepare signing
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug assembleRelease

      - name: Verify 16 KB alignment
        run: |
          python3 ci/check_elf_align.py \
            src/main/jniLibs/arm64-v8a/libnode.so \
            src/main/jniLibs/arm64-v8a/libc++_shared.so \
            src/main/jniLibs/arm64-v8a/libstnode.so

      - name: Checksums
        run: |
          find build/outputs/apk -name '*.apk' -exec sha256sum {} \; | tee checksums.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: st-mobile-apk
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/release/*.apk
            checksums.txt
            src/main/assets/payload_manifest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/outputs/apk/release/*.apk
            checksums.txt
            src/main/assets/payload_manifest.json
          generate_release_notes: true
